<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça seu logun no Rejet Corp</title>

</head>
<body>
<div class="container mt-3" >
    <div class="row justify-content-center">
        
            <form class="row g-4">
        <div class="col-md-6">
            <label for="Product" class="form-label">Produto</label>
            <input type="email" class="form-control" id="Product" placeholder="Informe o produto">
        </div>
        <div class="mb-3">
             <label for="Description" class="form-label">Descrição</label>
             <textarea class="form-control" id="description" rows="4" placeholder="Descreva o produto"></textarea>
        </div>
        <div class="col-5">
            <label for="quantities" class="form-label">Quantidades</label>
            <input type="text" class="form-control" id="quantities" placeholder="Quantidade do produto (kilos ou Toneladas)">
        </div>
        <div class="col-4">
            <label for="locationc" class="form-label">Local de coleta</label>
            <input type="text" class="form-control" id="locationc" placeholder="Av. Paulista, Sp, SP, 13212-000">
        </div>
        <div class="col-md-6">
            <label for="Pricep" class="form-label">Valor</label>
            <input type="text" class="form-control" id="Pricep" placeholder="R$ 000.000.000.000">
        </div>
       
        <div class="col-md-2">
            <label for="imagep" class="form-label">Imagem</label>
            <input type="file" class="form-control" id="Imagep">
        </div>
        <br>
        <br>
        <div class="md-4">
             <button type="submit" class="btn btn-success botao-cadastro">Cadastrar</button>
             </div>

        </div>
        <div>
                

    </div>

</div>
</form>
</body>
</html>
