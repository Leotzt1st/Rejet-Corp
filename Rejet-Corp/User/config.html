<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações</title>

  <style>
    :root{
      --color-primary: #A8C686;
      --color-secondary: #74CBE3;
      --color-bg: #FAF7F0;
      --color-text: #243127;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: "Poppins", sans-serif;
    }

    body{
      background: var(--color-bg);
      color: var(--color-text);
      min-height:100vh;
      overflow:auto;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* FUNDO */
    .bg-site{
      position: fixed;
      width:100%;
      height:100%;
      object-fit: cover;
      filter: blur(12px) brightness(0.6);
      transform: scale(1.1);
      z-index:-2;
    }

    .bg-overlay{
      position: fixed;
      width:100%;
      height:100%;
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(8px);
      z-index:-1;
    }

    /* LAYOUT */
    .container{
      display:grid;
      grid-template-columns: 260px 1fr;
      height:100vh;
    }

    /* SIDEBAR */
    .sidebar{
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      backdrop-filter: blur(12px);
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:10px;
      border-right:1px solid rgba(0,0,0,0.1);
      border-top-right-radius: 25px;
      border-bottom-right-radius: 25px;
    }

    .sidebar h2{
      margin-bottom:10px;
    }

    .menu-btn{
      padding:12px;
      border-radius:14px;
      cursor:pointer;
      transition:0.25s ease;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.35);
      color: #213f2e;
      font-weight: 600;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
    }

    .menu-btn:hover{
      background: rgba(168,198,134,0.33);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(22, 61, 27, 0.2);
    }

    .menu-btn.active{
      background: var(--color-primary);
      color:white;
      box-shadow: 0 10px 22px rgba(24, 71, 31, 0.32);
    }

    .menu-btn.active{
      background: var(--color-primary);
      color:white;
    }

    /* CONTEÚDO */
    .content{
      padding:40px;
      overflow-y:auto;
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap:25px;
    }

    .card{
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(14px);
      padding:20px;
      border-radius:20px;
      box-shadow: 0 14px 30px rgba(2, 47, 34, 0.12);
      transition:0.25s ease;
      border: 1px solid rgba(255,255,255,0.45);
    }

    .card:hover{
      transform: translateY(-5px);
    }

    h3{
      margin-bottom:15px;
    }

    label{
      font-size:14px;
      margin-bottom:5px;
      display:block;
    }

    input, select{
      width:100%;
      padding:10px;
      border-radius:10px;
      border:1px solid #ccc;
      margin-bottom:10px;
    }

    .toggle{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .switch{
      position:relative;
      width:50px;
      height:25px;
    }

    .switch input{
      opacity:0;
    }

    .slider{
      position:absolute;
      width:100%;
      height:100%;
      background:#ccc;
      border-radius:25px;
      cursor:pointer;
    }

    .slider:before{
      content:"";
      position:absolute;
      width:20px;
      height:20px;
      background:white;
      border-radius:50%;
      top:2.5px;
      left:3px;
      transition:0.3s;
    }

    input:checked + .slider{
      background: var(--color-primary);
    }

    input:checked + .slider:before{
      transform:translateX(25px);
    }

    .btn{
      grid-column:1/-1;
      padding:15px;
      border:none;
      border-radius:14px;
      background: var(--color-primary);
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#8fb26d;
    }

  </style>
</head>
<body>

<img src="https://picsum.photos/id/1015/1920/1080" class="bg-site">
<div class="bg-overlay"></div>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>⚙️ Config</h2>
    <div class="menu-btn active">Conta</div>
    <div class="menu-btn">Aparência</div>
    <div class="menu-btn">Notificações</div>
    <div class="menu-btn">Preferências</div>
  </div>

  <!-- CONTEÚDO -->
  <div class="content">

    <div class="card">
      <h3>Conta</h3>
      <label>Nome</label>
      <input type="text">
      <label>Email</label>
      <input type="email">
    </div>

    <div class="card">
      <h3>Aparência</h3>
      <label>Tema</label>
      <select>
        <option>Claro</option>
        <option>Escuro</option>
      </select>

      <div class="toggle">
        <span>Modo escuro</span>
        <label class="switch">
          <input type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <h3>Notificações</h3>
      <div class="toggle">
        <span>Ativar</span>
        <label class="switch">
          <input type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <h3>Preferências</h3>
      <label>Idioma</label>
      <select>
        <option>Português</option>
        <option>English</option>
      </select>
    </div>

    <button class="btn">Salvar alterações</button>

  </div>

</div>

</body>
</html>
